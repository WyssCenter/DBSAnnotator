name: dbs_annotator
# Shown in the Microsoft Store listing and on the app's tile, where it becomes
# the MSIX manifest Description, so this is user-facing copy, not a dev note.
description: "Wyss DBS Annotator documents deep brain stimulation programming visits, the appointments at which stimulation is tested and optimised. It writes them to analysis-ready BIDS TSV files, produces PDF and Word reports, and runs fully offline."
publish_to: "none"

# THE source of truth for the version. Android versionCode/versionName, the
# iOS/macOS FLUTTER_BUILD_NAME, the Windows FILEVERSION and the docs footer are
# all derived from this line; do not edit those by hand.
#
# Three literals cannot read it and so restate it: `appVersion` in
# lib/app_info.dart, `version:` in CITATION.cff, and `msix_version` below (which
# needs a fourth component the pubspec grammar has no room for).
# test/version_parity_test.dart fails if any of them disagrees with this.
#
# 0.5.x continues the product's own line: the Qt implementation shipped through
# v0.4.0 and this app is its successor. The +N build number must only ever
# increase once something has been published.
version: 0.6.0+2

environment:
  # Must not understate what the app actually needs. pubspec.lock resolves
  # against `dart: ">=3.12.0 <4.0.0"` / `flutter: ">=3.38.4"`, so this said
  # 3.4.0 while a contributor on 3.4 could not run `flutter pub get` at all.
  # The failure arrived from the lockfile, with no hint that the declared
  # constraint was the lie. Keep this at or above the lockfile's floor.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.38.4"

dependencies:
  flutter:
    sdk: flutter
  # TSV read/write with RFC4180 quoting so fields with embedded newlines
  # (notes, newline-separated scale_name/scale_value) round-trip like Python csv.
  csv: ^6.0.0
  path_provider: ^2.1.4
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  # Opens the repository, issues and contact links in the About dialog. Its
  # Windows and Linux plugins were already being linked through share_plus, so
  # on the desktop targets this adds the Dart side of something already shipped.
  url_launcher: ^6.3.2
  # Report export: native PDF, no MS Word needed.
  #
  # Two chart-related packages are deliberately NOT dependencies:
  # `printing` (nothing imports it, and it drags a pdfium download plus
  # gtk+-unix-print into every Linux/Windows desktop build) and `fl_chart`
  # (every chart, on screen and in both report formats, is drawn by
  # ui/scales_chart_painter.dart + ui/chart_primitives.dart, so screen and print
  # cannot disagree).
  pdf: ^3.11.1
  # Desktop window sizing + title (Linux/Windows/macOS). No-op on mobile.
  window_manager: ^0.5.2
  # Word (.docx) export = zipping OOXML parts (already transitive via pdf).
  archive: ^4.3.0
  # Primary-display work area, to clamp the window to the screen (transitive via
  # window_manager; pinned direct so main.dart can import it).
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  cross_file: ^0.3.4
  flutter_lints: ^6.0.0
  # App icon generation (run: dart run flutter_launcher_icons). See .github/RELEASING.md.
  flutter_launcher_icons: ^0.14.1
  # Windows MSIX packaging. See msix_config below
  # and the Windows section of .github/RELEASING.md.
  msix: ^3.18.0

flutter:
  uses-material-design: true

  # The machine-readable domain contract, bundled straight from schema/.
  assets:
    - schema/
    # Optional Unicode report fonts (IBMPlexSans-Regular.ttf / -Bold.ttf, OFL):
    # drop the TTFs here; reports fall back to Helvetica (ASCII-only) when
    # absent. See lib/report/report_fonts.dart and .github/RELEASING.md.
    - assets/fonts/
    # The app icon, shown in the AppBar and the About dialog, and bundled so the
    # Linux runner can set the window icon.
    - assets/icon/

# Platform icons, rendered by `tool/build_brand_assets.py` from
# assets/brand/ann-icon.svg. Regenerate with `dart run flutter_launcher_icons`.
# The Linux window icon is set in linux/runner/my_application.cc.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#95F9D8"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_foreground.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#95F9D8"
  windows:
    generate: true
    image_path: "assets/icon/desktop_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/macos_icon.png"

# Windows MSIX packaging. Two builds, one config: self-signed by default, to
# INSTALL and verify locally, and unsigned with --store, to UPLOAD to Partner
# Center. The commands are in the Windows section of .github/RELEASING.md.
#
# A Store package is unsigned by design (Microsoft re-signs it after
# certification, which is why no code-signing certificate is needed and none
# should ever be bought for this project). Unsigned means uninstallable, so the
# self-signed build is the only way to smoke-test the package. It is a testing
# tool, not a second distribution channel.
#
# The identity below is the SIDELOAD identity. The Store's is different and is
# NOT committed: Partner Center assigns `identity_name` from the reserved app
# name and issues the `CN=...` publisher, and both are passed on the command
# line at build time. They are case-sensitive, punctuation included, and a
# mismatch is the most common submission rejection. See .github/RELEASING.md.
msix_config:
  display_name: Wyss DBS Annotator
  publisher_display_name: Wyss Center for Bio and Neuroengineering
  identity_name: ch.wysscenter.DBSAnnotator
  # Four components, and the fourth MUST be 0: Microsoft reserves the revision
  # field for Store use. That is why this cannot be derived from the pubspec
  # `version: x.y.z+build` above; the build number is not a revision.
  # Keep the first three equal to it; test/version_parity_test.dart enforces it.
  msix_version: 0.6.0.0
  # One 1024x1024 source for every tile except the badge, which comes from windows/msix/.
  logo_path: assets/icon/app_icon.png
  architecture: x64
  output_path: build/windows/msix
  # Do not auto-install the generated test certificate: that needs elevation,
  # so it turns any non-interactive build (CI, a script) into a prompt or a
  # failure. Trusting the certificate is a deliberate, documented step on each
  # test machine; see the Windows section of .github/RELEASING.md.
  install_certificate: false
  # Do NOT let msix drive the Flutter build. It shells out to `flutter build
  # windows` with its own flags, and a build invoked with a different
  # configuration than the previous one has twice now made Flutter's build
  # system delete windows/flutter/ephemeral/cpp_client_wrapper/*.cc and then
  # skip re-copying them (its filecache believes the unpack step is current),
  # so the next build fails with C1083 on files nobody touched. Build first,
  # package second.
  # msix validates that the expected .exe is present, so a forgotten build
  # fails loudly rather than packaging a stale one.
  build_windows: false
  # No `capabilities:` on purpose. The app makes no network calls and uses no
  # camera, microphone, location or background tasks; ordinary full-trust file
  # access needs no declaration, and declaring an unused capability invites
  # certification questions about why.
