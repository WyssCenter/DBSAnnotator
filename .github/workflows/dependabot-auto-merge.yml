name: Dependabot auto-merge


on: pull_request

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (CI-proven ecosystems only)
        if: >-
          (steps.meta.outputs.package-ecosystem == 'github_actions' ||
           steps.meta.outputs.package-ecosystem == 'pip') &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note that this one merges by hand
        if: >-
          !((steps.meta.outputs.package-ecosystem == 'github_actions' ||
             steps.meta.outputs.package-ecosystem == 'pip') &&
            steps.meta.outputs.update-type != 'version-update:semver-major')
        run: |
          {
            echo "### Not auto-merged"
            echo "Ecosystem \`${{ steps.meta.outputs.package-ecosystem }}\`,"
            echo "update type \`${{ steps.meta.outputs.update-type }}\`."
            echo
            echo "\`pub\` changes reach the code that writes clinical documents,"
            echo "and majors change behaviour. Review and merge by hand."
          } >> "$GITHUB_STEP_SUMMARY"
